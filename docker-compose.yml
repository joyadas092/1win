version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: membership_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: membership_bot
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  bot:
    build: .
    container_name: membership_bot
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
    volumes:
      - ./logs:/app/logs

volumes:
  mongo_data:
